name: Windows build

# Builds only: PyInstaller one-folder + portable zip + Inno installer, with
# the official tectonic binary and a warmed TeX cache bundled. Uploads them
# as a workflow artifact and never creates a release (that is done by hand
# after the build is checked). Trigger: push a tag on dev,
#
#   git tag v<__version__> && git push origin v<__version__>
#
# (`v*` does not match `macos-v*`: tag patterns are anchored at the start.)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Run the test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q

      - name: Fetch tectonic and warm the offline TeX cache
        run: python packaging/fetch_tectonic.py --warm

      - name: Build the installer and portable zip
        run: python packaging/build_installer.py

      - name: Check the build
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python -c "import khervedoc; print(khervedoc.__version__)")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          case "$GITHUB_REF_NAME" in v*) test "v$VERSION" = "$GITHUB_REF_NAME" ;; esac
          test -f dist/KherveTeX/KherveTeX.exe
          find dist/KherveTeX -name tectonic.exe | grep -q .
          test -d dist/KherveTeX/_internal/khervedoc/tectonic_cache
          ls -lh "dist/Setup_KherveTeX_$VERSION.exe" "dist/KherveTeX_$VERSION.zip" dist/KherveTeX-Setup.exe
          python -c "import zipfile,sys; n=zipfile.ZipFile(sys.argv[1]).namelist(); assert n and all(x.startswith('KherveTeX/') for x in n); assert 'KherveTeX/KherveTeX.exe' in n" "dist/KherveTeX_$VERSION.zip"

      - name: Smoke-test the frozen app
        shell: bash
        run: python packaging/smoke_test.py dist/KherveTeX/KherveTeX.exe

      - name: Install silently, smoke-test the installed app, uninstall
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "KherveTeX-installed"
          $log = Join-Path $env:RUNNER_TEMP "install.log"
          $p = Start-Process -FilePath "dist\Setup_KherveTeX_$env:VERSION.exe" `
            -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/DIR=$dir","/LOG=$log" `
            -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 40; throw "installer exited $($p.ExitCode)" }
          if (-not (Test-Path "$dir\KherveTeX.exe")) { Get-Content $log -Tail 40; throw "KherveTeX.exe was not installed" }
          python packaging/smoke_test.py "$dir\KherveTeX.exe"
          if ($LASTEXITCODE -ne 0) { throw "smoke test of the installed app failed" }
          Start-Process -FilePath "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path "$dir\KherveTeX.exe"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$dir\KherveTeX.exe") { throw "the uninstaller did not remove the app" }
          Write-Host "install / run / uninstall OK"

      - name: Upload the app log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log-windows
          path: ${{ runner.temp }}/khervetex-smoke.log
          if-no-files-found: ignore

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: KherveTeX-${{ env.VERSION }}-windows
          path: |
            dist/Setup_KherveTeX_*.exe
            dist/KherveTeX-Setup.exe
            dist/KherveTeX_*.zip
          if-no-files-found: error
