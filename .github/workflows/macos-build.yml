name: macOS build

# Builds only: arm64 (macos-14) and x86_64 (macos-15-intel) DMGs with the
# official tectonic binary and a warmed TeX cache bundled, ad hoc signed
# (docs/MACOS_INSTALLER_SPEC.md in khervefitting-web). Uploads them as
# workflow artifacts and never creates a release. Trigger:
#
#   git tag macos-v<__version__> && git push origin macos-v<__version__>

on:
  push:
    tags:
      - "macos-v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Run the test suite
        env:
          QT_QPA_PLATFORM: offscreen
        # one process per file: see packaging/run_tests.py for why
        run: python packaging/run_tests.py

      - name: Fetch tectonic and warm the offline TeX cache
        run: python packaging/fetch_tectonic.py --warm

      - name: Build the .app and the DMG
        run: python packaging/build_macos.py

      - name: Check the bundle
        run: |
          set -euo pipefail
          VERSION=$(python -c "import khervedoc; print(khervedoc.__version__)")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          case "$GITHUB_REF_NAME" in macos-v*) test "macos-v$VERSION" = "$GITHUB_REF_NAME" ;; esac
          APP=dist/KherveTeX.app
          test -x "$APP/Contents/MacOS/KherveTeX"
          plutil -p "$APP/Contents/Info.plist" | grep -E 'CFBundleIdentifier|CFBundleShortVersionString'
          codesign --verify --deep --strict "$APP"
          file -b "$APP/Contents/MacOS/KherveTeX" | grep -q '${{ matrix.arch }}'
          T=$(find "$APP" -name tectonic -type f | head -1)
          file -b "$T" | grep -q '${{ matrix.arch }}'
          find "$APP" -maxdepth 6 -name tectonic_cache | grep -q .

      - name: Smoke-test the frozen app
        run: python packaging/smoke_test.py dist/KherveTeX.app/Contents/MacOS/KherveTeX

      - name: Upload the app log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log-macOS-${{ matrix.arch }}
          path: ${{ runner.temp }}/khervetex-smoke.log
          if-no-files-found: ignore

      - name: Upload the DMG
        uses: actions/upload-artifact@v4
        with:
          name: KherveTeX-${{ env.VERSION }}-macOS-${{ matrix.arch }}
          path: |
            dist/KherveTeX-*macOS-${{ matrix.arch }}.dmg
            dist/KherveTeX-*macOS-${{ matrix.arch }}.dmg.sha256
            dist/KherveTeX-macOS-${{ matrix.arch }}.json
          if-no-files-found: error
